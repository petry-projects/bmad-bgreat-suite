# Apply repository settings — enforces check-suite auto-trigger preferences and
# any other settings defined in scripts/apply-repo-settings.sh, plus the codified
# compliance rulesets in standards/rulesets/*.json via scripts/apply-rulesets.sh.
#
# Runs on push to main and on manual dispatch so settings are re-applied
# automatically after each merge and are recoverable via workflow_dispatch.
name: Apply repository settings

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: apply-repo-settings
  cancel-in-progress: false

permissions: {}

jobs:
  apply-settings:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout only; repo-admin API calls use GH_PAT_WORKFLOWS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply repository settings
        # The default GITHUB_TOKEN cannot be granted repo-admin scope, which the
        # check-suites/security/code-scanning API calls require, so authenticate
        # with the org's classic PAT instead.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_WORKFLOWS }}
        run: bash scripts/apply-repo-settings.sh "${{ github.repository }}"
      - name: Apply compliance rulesets
        # Converges the codified pr-quality ruleset (standards/rulesets/pr-quality.json)
        # onto the repo so drift such as dismiss_stale_reviews_on_push self-heals after
        # each merge. Requires administration:write, provided by the org PAT.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_WORKFLOWS }}
        run: bash scripts/apply-rulesets.sh --repo "${{ github.repository }}" pr-quality
